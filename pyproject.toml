[project]
name = "longshot"
version = "0.1.0"
description = "Reproducible search for long-period single and duotransit candidates around M dwarfs in TESS data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "astropy>=7.0",
    "astroquery>=0.4.11",
    "lightkurve>=2.6",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    # Rewritten in late 2026; pinned exactly, behaviour guarded by tests (D003).
    "wotan==2.1.1",
    "batman-package>=2.5.3",
    "setuptools>=70",
    "tabulate>=0.10.0",
]

[project.scripts]
longshot = "longshot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longshot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (skipped unless LONGSHOT_NETWORK_TESTS=1)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
